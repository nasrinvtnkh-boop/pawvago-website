name: Beta signup smoke test
on:
  pull_request:
    paths:
      - 'beta.js'
      - 'index.html'
      - 'styles.css'
      - 'BETA-LAUNCH-PLAN.md'
      - 'tests/beta.spec.cjs'
      - '.github/workflows/beta-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check client script syntax
        run: node --check beta.js
      - name: Verify opt-in funnel wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('index.html', 'utf8');
          const js = fs.readFileSync('beta.js', 'utf8');
          const css = fs.readFileSync('styles.css', 'utf8');
          for (const id of ['beta', 'betaForm', 'betaEmail', 'betaConsent', 'betaNotice']) {
            assert(html.includes('id="' + id + '"'), 'Missing ' + id);
          }
          assert(html.includes('src="beta.js"'), 'Missing script link');
          assert(html.includes('href="#beta"'), 'Missing CTA link');
          assert(js.includes('signInWithOtp'), 'Missing magic link sign-in');
          assert(js.includes('consentField.checked'), 'Missing explicit opt-in');
          assert(css.includes('.beta-shell'), 'Missing beta styles');
          console.log('Beta funnel wiring checks passed.');
          NODE
      - name: Install browser test dependencies
        run: |
          npm install --no-save @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Start site locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pawvago-http.log 2>&1 &
          echo $! > /tmp/pawvago-http.pid
          for i in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
      - name: Exercise beta signup in Chromium
        run: npx playwright test tests/beta.spec.cjs --project=chromium --workers=1
