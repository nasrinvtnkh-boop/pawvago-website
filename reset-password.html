<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Reset your password | PawVago</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1b304b;font:15px/1.6 system-ui,-apple-system,sans-serif}
header{background:#fff;border-bottom:1px solid #dae4ed;padding:17px 20px}header a{color:#1b304b;font-weight:800;text-decoration:none}
main{max-width:480px;margin:9vh auto 40px;padding:28px;background:white;border-radius:22px;box-shadow:0 15px 40px #13253b13}
h1{font-size:29px;line-height:1.2;margin:0 0 14px}p{color:#54697b}
label{display:block;font-weight:700;margin:17px 0 6px}input{width:100%;padding:13px;border:1px solid #b8c8d7;border-radius:11px;font:inherit}
button{background:#192f4d;border:0;border-radius:11px;color:#fff;padding:13px 18px;font-weight:800;margin-top:20px;width:100%;cursor:pointer}
button:disabled{opacity:.5}a{color:#2a577f}#notice{margin-top:16px;min-height:22px}#newPassForm[hidden],#emailForm[hidden]{display:none}
</style></head>
<body><header><a href="/">← PawVago</a></header><main>
<h1>Reset your PawVago password</h1>
<p>One account works on <strong>pawvago.com</strong>, Android and iPhone.</p>
<form id="emailForm"><label for="email">Your account email</label><input id="email" type="email" autocomplete="email" required>
<button type="submit">Email me a reset link</button></form>
<form id="newPassForm" hidden><label for="newpass">New password</label><input id="newpass" type="password" autocomplete="new-password" minlength="8" required>
<label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
<button type="submit">Save new password</button></form>
<div id="notice" role="status" aria-live="polite"></div>
<p><small>Never share your password or reset link. The link is intended for the owner of your email account.</small></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script>
<script>
(()=>{const c=window.PAWVAGO_CONFIG||{},note=document.querySelector("#notice");
  const client=window.supabase?.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY,
    {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  if(!client){note.textContent="Account service temporarily unavailable.";return}
  const email=document.querySelector("#emailForm"),password=document.querySelector("#newPassForm");
  const initial=location.hash.includes("type=recovery")||location.search.includes("type=recovery");
  const recovery=()=>{email.hidden=true;password.hidden=false;note.textContent="Choose a new password for your PawVago account."};
  if(initial)recovery();
  client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)recovery()});
  email.addEventListener("submit",async(event)=>{event.preventDefault();
    const button=email.querySelector("button");button.disabled=true;note.textContent="Sending…";
    try{const{error}=await client.auth.resetPasswordForEmail(document.querySelector("#email").value.trim(),
      {redirectTo:"https://www.pawvago.com/reset-password.html"});if(error)throw error;
      note.textContent="If this address has an account, a password-reset email will arrive. Check your inbox and spam folder."}
    catch{note.textContent="Unable to request a reset at this moment. Please try again."}finally{button.disabled=false}
  });
  password.addEventListener("submit",async(event)=>{event.preventDefault();
    const a=document.querySelector("#newpass").value,b=document.querySelector("#confirm").value;
    if(a!==b){note.textContent="The two passwords do not match.";return}
    if(a.length<8){note.textContent="Use at least eight characters.";return}
    const button=password.querySelector("button");button.disabled=true;note.textContent="Updating…";
    try{const{error}=await client.auth.updateUser({password:a});if(error)throw error;
      note.textContent="Your password was updated. You can now sign in on the PawVago website and app.";
      password.hidden=true;await client.auth.signOut();
    }catch{note.textContent="Reset session expired or invalid. Request a fresh reset email.";button.disabled=false}
  });
})();
</script></body></html>
